<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 퀴즈 · 진행 화면</title>
<script src="vendor/qrcode.min.js"></script>
<style>
:root{
  --bg:#141821; --panel:#1d2330; --ink:#f1f4f9; --muted:#9aa4b4; --line:#2b3340;
  --accent:#6ea8fe; --c0:#00a99d; --c1:#2f80ed; --c2:#f0a44a; --c3:#e4596a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar h1{font-size:16px;margin:0;font-weight:700}
.bar .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);border-radius:8px;padding:8px 16px}
button.go{background:var(--accent);border-color:var(--accent);color:#0d1016;font-weight:700}
button.stop{border-color:#e4596a;color:#ff9a9a}
button:disabled{opacity:.4;cursor:not-allowed}
input{font:inherit;padding:8px 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--ink);width:220px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;padding:24px;text-align:center}
.pill{font-size:13px;color:var(--muted)}
.join{display:flex;gap:40px;align-items:center;flex-wrap:wrap;justify-content:center}
#qr{background:#fff;padding:14px;border-radius:14px;line-height:0}
.url{font-size:22px;font-weight:700;word-break:break-all;max-width:11ch}
.big{font-size:64px;font-weight:800;letter-spacing:-.02em;line-height:1}
.q{font-size:clamp(22px,3.4vw,40px);font-weight:700;max-width:22ch;line-height:1.35;text-wrap:balance}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(900px,92vw)}
.opt{position:relative;border-radius:12px;padding:16px 16px 16px 46px;text-align:left;
  font-size:clamp(15px,1.7vw,21px);font-weight:600;color:#fff;min-height:84px;
  display:flex;align-items:center}
.opt .n{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:24px;height:24px;
  border-radius:7px;background:rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;font-size:13px}
.opt.o0{background:var(--c0)}.opt.o1{background:var(--c1)}.opt.o2{background:var(--c2)}.opt.o3{background:var(--c3)}
.opt.right{outline:4px solid #fff}
.opt .cnt{position:absolute;right:14px;bottom:10px;font-size:14px;font-weight:800}
.opt .fill{position:absolute;left:0;bottom:0;height:5px;background:rgba(255,255,255,.85);border-radius:0 3px 3px 0;transition:width .4s}
.tim{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums}
.prog{width:min(900px,92vw);height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#ffd93d,#ff8a3d,#e4382c);transition:width .3s linear}
.board{width:min(680px,92vw);display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:11px 16px;font-size:17px}
.row.t{font-weight:800;font-size:19px}
.row .r{width:38px}
.row .s{margin-left:auto;font-variant-numeric:tabular-nums}
.msg{color:var(--muted);font-size:14px}
.ok{color:#7ee2a8}.no{color:#ff9a9a}
.sheet{width:min(760px,94vw);background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:18px;text-align:left}
.sheet textarea{width:100%;height:240px;font-family:ui-monospace,monospace;font-size:12.5px;
  background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:11px}
.sheet .row2{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sheet h2{font-size:15px;margin:0 0 8px}
</style>
</head>
<body>
<div class="bar">
  <h1>오늘의 퀴즈 · 진행 화면</h1>
  <span class="pill" id="st">관리 코드를 넣어 주십시오</span>
  <span class="sp">
    <input id="key" type="password" placeholder="관리 코드" autocomplete="off">
    <button id="save">확인</button>
    <button id="load" hidden>퀴즈 올리기</button>
    <button id="start" class="go" hidden>시작</button>
    <button id="stop" class="stop" hidden>멈춤</button>
  </span>
</div>
<main id="m"><div class="msg">관리 코드를 넣으면 퀴즈 상태가 보입니다.</div></main>

<script>
var API = (new URLSearchParams(location.search).get("api")) ||
          ("https://lecture-agent-culture-api.vercel.app").replace(/\/$/, "");
var KEY = "";
try { KEY = sessionStorage.getItem("quizKey") || ""; } catch (e) {}
var STUDENT = location.origin + location.pathname.replace(/host\.html$/, "");
var $ = function (s) { return document.querySelector(s); };
var esc = function (s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };
var last = null, qr = null;
var SAMPLE = {
  title: "\ucca0\uc0ac\ubb38 5\uc8fc\ucc28 \u00b7 \uc815\uc2e0\ubd84\uc11d\uacfc \ubb38\ud654 \uc774\ud574",
  pin: "5205", secs: 20, reveal: 6,
  qs: [
    { t: "choice", q: "\ud504\ub85c\uc774\ud2b8\uc758 \uc2ec\uc801 \uc7a5\uce58\uc5d0\uc11c \uc790\uc544(ego)\uac00 \ub9e1\ub294 \uad6c\uc2e4\uc740?",
      a: ["\uc258\ub77d\uc744 \uadf8\ub300\ub85c \ubc00\uc5b4\ubd99\uc778\ub2e4", "\uc774\ub4dc\uc640 \ucd08\uc790\uc544 \uc0ac\uc774\ub97c \uc911\uc7ac\ud55c\ub2e4",
          "\ubd80\ubaa8\uc758 \uae08\uc9c0\ub97c \uadf8\ub300\ub85c \ubb3c\ub824\ubc1b\ub294\ub2e4", "\ubb34\uc758\uc2dd\uc744 \ub0a8\uae40\uc5c6\uc774 \uc758\uc2dd\uc73c\ub85c \ub04c\uc5b4\uc62c\ub9b0\ub2e4"], c: 1 },
    { t: "ox", q: "\uc5b5\uc555\ub41c \uac83\uc740 \uc644\uc804\ud788 \uc0ac\ub77c\uc9c4\ub2e4.", c: 1 },
    { t: "short", q: "\ucea0\ub77d\uc6d0\uce59\uacfc \ub2ec\ub9ac \ud604\uc2e4\uc6d0\uce59\uc774 \ub9cc\uc871\uc5d0 \ub300\ud574 \ud558\ub294 \uc77c\uc740? (\ub450 \uae00\uc790)",
      ans: ["\uc9c0\uc5f0", "\ubbf8\ub8f8", "\uc720\uc608"], secs: 25 },
    { t: "initial", q: "\ucd08\uc790\uc544\uac00 \ubb3c\ub824\ubc1b\ub294\ub2e4\uace0 \ud55c \uac83 \u2014 \ubd80\ubaa8\uc758 \uae08\uc9c0\uc640 \uba85\ub839\uc774 \uc790\ub9ac\uc7a1\uc740 \uac83\uc744 \ubb34\uc5c7\uc774\ub77c \ud558\ub294\uac00?",
      hint: "\u3131\u3148", ans: ["\uaddc\uc81c", "\uae08\uc9c0"], secs: 25 },
    { t: "order", q: "\uc5b5\uc555\uc774 \uc791\ub3d9\ud558\ub294 \ucc28\ub840\ub97c \ub9de\ucdb0 \ubcf4\uc2ed\uc2dc\uc624.",
      a: ["\ucda9\ub3d9\uc774 \uc62c\ub77c\uc628\ub2e4", "\uac80\uc5f4\uc774 \ub9c9\ub294\ub2e4", "\ubb34\uc758\uc2dd\uc5d0 \ub20c\ub9b0\ub2e4", "\ubaa8\uc2b5\uc744 \ubc14\uafd4 \ub3cc\uc544\uc628\ub2e4"],
      c: [0, 1, 2, 3], secs: 30 },
    { t: "choice", q: "\u300e\ubb38\uba85 \uc18d\uc758 \ubd88\ub9cc\u300f\uc774 \ub9d0\ud558\ub294 \ubb38\uba85\uc758 \uc131\uaca9\uc740?",
      a: ["\uc548\uc804\uc744 \uc5bb\ub294 \ub300\uc2e0 \uc790\uc720\ub97c \ub0b4\uc8fc\ub294 \uac70\ub798", "\ud589\ubcf5\uc744 \ub298\ub9ac\uae30\ub9cc \ud558\ub294 \uc7a5\uce58",
          "\ucda9\ub3d9\uc744 \ub0a8\uae40\uc5c6\uc774 \uc5c6\uc560\ub294 \uc81c\ub3c4", "\uc8c4\ucc45\uac10\uacfc\ub294 \ubb34\uad00\ud55c \uc9c8\uc11c"], c: 0 }
  ]
};

if (KEY) $("#key").value = KEY;
var keyOK = false;
function checkKey() {
  if (!KEY) { $("#st").innerHTML = '<span class="no">관리 코드를 넣어 주십시오</span>'; return Promise.resolve(false); }
  $("#st").textContent = "확인 중…";
  return fetch(API + "/api/stats?key=" + encodeURIComponent(KEY) + "&days=1", { cache: "no-store" })
    .then(function (r) {
      keyOK = r.status === 200;
      $("#st").innerHTML = keyOK ? '<span class="ok">관리 코드 확인됨</span>'
                                 : '<span class="no">관리 코드가 맞지 않습니다</span>';
      $("#load").hidden = !keyOK;
      if (keyOK) tick();
      return keyOK;
    })
    .catch(function () {
      $("#st").innerHTML = '<span class="no">서버에 닿지 못했습니다</span>';
      return false;
    });
}

$("#save").onclick = function () {
  KEY = $("#key").value.trim();
  try { sessionStorage.setItem("quizKey", KEY); } catch (e) {}
  checkKey();
};

$("#load").onclick = function () {
  $("#m").innerHTML = '<div class="sheet"><h2>퀴즈 올리기</h2>' +
    '<div class="msg">아래 내용을 고쳐 「올리기」를 누르십시오. 올려도 시작되지는 않습니다.</div>' +
    '<textarea id="qjson"></textarea>' +
    '<div class="row2"><button class="go" id="put">올리기</button>' +
    '<button id="cancel">취소</button><span class="msg" id="pmsg"></span></div></div>';
  $("#qjson").value = JSON.stringify(SAMPLE, null, 1);
  $("#cancel").onclick = tick;
  $("#put").onclick = function () {
    var q;
    try { q = JSON.parse($("#qjson").value); }
    catch (e) { $("#pmsg").innerHTML = '<span class="no">형식이 잘못됐습니다</span>'; return; }
    q.act = "set"; q.key = KEY;
    fetch(API + "/api/quiz", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(q) })
      .then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
      .then(function (x) {
        if (x.s !== 200) { $("#pmsg").innerHTML = '<span class="no">' + esc(x.j.detail || "올리지 못했습니다") + "</span>"; return; }
        $("#pmsg").innerHTML = '<span class="ok">올렸습니다 · ' + x.j.qs.length + "문항 · PIN " + x.j.pin + "</span>";
        setTimeout(tick, 900);
      })
      .catch(function () { $("#pmsg").innerHTML = '<span class="no">보내지 못했습니다</span>'; });
  };
};
$("#start").onclick = function () {
  if (!confirm("퀴즈를 시작합니다. 학생 화면에 바로 뜹니다. 계속할까요?")) return;
  send("start");
};
$("#stop").onclick = function () {
  if (!confirm("퀴즈를 멈춥니다. 학생 화면에서 사라집니다.")) return;
  send("stop");
};
function send(act) {
  fetch(API + "/api/quiz", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ act: act, key: KEY }) })
    .then(function (r) { return r.json(); })
    .then(function () { tick(); })
    .catch(function () {});
}

function qrInto(box) {
  box.innerHTML = "";
  qr = new QRCode(box, { text: STUDENT, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M });
}

function draw(s) {
  var m = $("#m");
  $("#start").hidden = !(s.phase === "idle" || s.phase === "done");
  $("#stop").hidden = !(s.phase === "ask" || s.phase === "reveal");
  if (!keyOK && !KEY) return;
  $("#st").textContent = s.phase === "none" ? "관리 코드 확인됨 · 올린 퀴즈가 없습니다"
    : (s.title || "") + " · " + (s.phase === "idle" ? "대기 중" :
       s.phase === "done" ? "끝남" : (s.idx + 1) + "/" + s.n + " 문제");

  if (s.phase === "none") { m.innerHTML = '<div class="msg">퀴즈를 먼저 올려 주십시오. <br>quiz_run.ps1 -Set</div>'; return; }

  if (s.phase === "idle") {
    m.innerHTML = '<div class="pill">학생은 아래 주소나 QR로 들어옵니다</div>' +
      '<div class="join"><div id="qr"></div>' +
      '<div><div class="url">' + esc(STUDENT.replace(/^https?:\/\//, "")) + '</div>' +
      '<div class="pill" style="margin-top:12px">PIN</div><div class="big">' + esc(s.pin || "----") + '</div>' +
      '<div class="pill" style="margin-top:12px">참여</div>' +
      '<div class="big">' + (s.players || 0) + '</div></div></div>' +
      '<div class="msg">「시작」을 누르면 모든 화면이 동시에 1번 문제로 갑니다.</div>';
    qrInto($("#qr"));
    return;
  }

  if (s.phase === "ask") {
    var d = (s.dist && s.dist.d) || [0, 0, 0, 0];
    var tot = Math.max(1, s.answered || 0);
    m.innerHTML = '<div class="tim">' + s.left + '</div>' +
      '<div class="prog"><i style="width:' + (100 * s.left / s.secs).toFixed(1) + '%"></i></div>' +
      '<div class="q">' + esc(s.q.q) + "</div>" +
      '<div class="grid">' + s.q.a.map(function (a, i) {
        return '<div class="opt o' + i + '"><span class="n">' + (i + 1) + "</span>" + esc(a) +
          '<span class="cnt">' + (d[i] || 0) + "</span>" +
          '<span class="fill" style="width:' + (100 * (d[i] || 0) / tot).toFixed(1) + '%"></span></div>';
      }).join("") + "</div>" +
      '<div class="pill">' + (s.answered || 0) + " / " + (s.players || 0) + "명 답했습니다</div>";
    return;
  }

  // reveal · done
  var d2 = (s.dist && s.dist.d) || [0, 0, 0, 0];
  var tot2 = Math.max(1, d2.reduce(function (a, b) { return a + b; }, 0));
  m.innerHTML =
    (s.phase === "done" ? '<div class="big">최종 순위</div>' :
      '<div class="q">' + esc(s.q.q) + "</div>" +
      '<div class="grid">' + s.q.a.map(function (a, i) {
        return '<div class="opt o' + i + (i === s.q.c ? " right" : "") + '"><span class="n">' +
          (i + 1) + "</span>" + esc(a) + '<span class="cnt">' + (d2[i] || 0) + "명</span>" +
          '<span class="fill" style="width:' + (100 * (d2[i] || 0) / tot2).toFixed(1) + '%"></span></div>';
      }).join("") + "</div>") +
    '<div class="board">' + (s.board || []).slice(0, 8).map(function (x) {
      return '<div class="row' + (x.r <= 3 ? " t" : "") + '"><span class="r">' +
        (x.r <= 3 ? ["🥇", "🥈", "🥉"][x.r - 1] : x.r) + "</span><span>" + esc(x.nick) +
        "</span><span class=\"s\">" + x.s + "점</span></div>";
    }).join("") + "</div>" +
    '<div class="pill">' + (s.players || 0) + "명 참여" +
    (s.phase === "reveal" ? " · " + s.left + "초 뒤 다음 문제" : "") + "</div>";
}

function tick() {
  if (!API) { $("#st").textContent = "API 주소를 찾지 못했습니다 (?api= 로 주십시오)"; return; }
  var u = API + "/api/quiz" + (KEY ? "?key=" + encodeURIComponent(KEY) : "");
  fetch(u, { cache: "no-store" }).then(function (r) { return r.json(); })
    .then(function (s) { last = s; draw(s); }).catch(function () {});
}
if (KEY) checkKey(); else $("#st").innerHTML = '<span class="no">관리 코드를 넣어 주십시오</span>';
tick();
setInterval(function () { if (!document.querySelector(".sheet")) tick(); }, 1000);
</script>
</body>
</html>
